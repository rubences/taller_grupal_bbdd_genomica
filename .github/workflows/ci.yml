name: Genomic Database QA

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate project structure and SQL constraints
        run: python scripts/validate_project.py
      - name: Ensure no database dump is committed
        shell: bash
        run: |
          if git ls-files | grep -Ei '\.(dump|sql\.gz)$'; then
            echo 'ERROR: no versionar dumps pesados.'
            exit 1
          fi
          echo 'PASS: sin dumps pesados.'
